<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M365Sphere — PST Backup</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('m365cache:theme'));
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <script src="/session-token.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
